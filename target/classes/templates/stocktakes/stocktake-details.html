
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складова ревизия</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-wrapper">

    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">

        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content">

            <div class="content-header">
                <div class="orders-title-search">
                    <h1 class="page-title-blue">
                        Складова ревизия №<span th:text="${stocktake.id}"></span>
                    </h1>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">

                    <a th:href="@{/stocktakes/{id}/export(id=${stocktake.id})}"
                       class="btn-new-order">
                        Експорт Excel
                    </a>

                    <form th:action="@{/stocktakes/{id}/import/preview(id=${stocktake.id})}"
                          method="post"
                          enctype="multipart/form-data"
                          style="display: flex; gap: 10px; align-items: center;">

                        <input type="file"
                               name="file"
                               accept=".xlsx"
                               required>

                        <button type="submit" class="btn-new-order">
                            Импорт Excel
                        </button>

                    </form>

                    <a th:href="@{/stocktakes}" class="btn-new-order">
                        Назад
                    </a>

                </div>
            </div>

            <div style="margin-bottom: 20px;">

                <p>
                    <strong>Създадена на:</strong>
                    <span th:text="${#temporals.format(stocktake.createdOn, 'dd.MM.yyyy HH:mm')}"></span>
                </p>

                <p>
                    <strong>Създал:</strong>
                    <span th:text="${stocktake.createdBy.username}"></span>
                </p>

                <p>
                    <strong>Последен импорт:</strong>
                    <span th:text="${stocktake.importedOn != null
                        ? #temporals.format(stocktake.importedOn, 'dd.MM.yyyy HH:mm')
                        : 'Няма'}"></span>
                </p>

            </div>

            <form th:action="@{/stocktakes/{id}/save(id=${stocktake.id})}"
                  th:object="${stocktakeCountRequest}"
                  method="post">

                <div class="table-container orders-table">

                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Категория</th>
                            <th>Продукт</th>
                            <th>Баркод</th>
                            <th>Размер / Ф</th>
                            <th>Sph / Cyl / Add / prism</th>
                            <th>Начална наличност</th>
                            <th>Преброено количество</th>
                            <th>Разлика</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="item, stat : ${stocktake.items}">

                            <td th:text="${item.product.id}"></td>

                            <td th:text="${item.product.category != null
                                ? item.product.category.displayName
                                : '—'}"></td>

                            <td style="white-space: nowrap;">
                                <span th:text="${item.product.brand}"></span>
                                <span th:text="' ' + ${item.product.model}"></span>
                            </td>

                            <td th:text="${item.product.barcode}"></td>

                            <td th:text="${item.product.sizeOrDiameter}"></td>

                            <td style="white-space: nowrap;">
                                <span th:text="'sph: ' + ${item.product.sph}"></span>

                                <span th:if="${item.product.cyl != null
                                    and item.product.cyl.compareTo(T(java.math.BigDecimal).ZERO) != 0}"
                                      th:text="' cyl: ' + ${item.product.cyl}"></span>

                                <span th:if="${item.product.addPower != null
                                    and item.product.addPower.compareTo(T(java.math.BigDecimal).ZERO) != 0}"
                                      th:text="' add: ' + ${item.product.addPower}"></span>

                                <span th:if="${item.product.prism != null
                                    and item.product.prism.compareTo(T(java.math.BigDecimal).ZERO) != 0}"
                                      th:text="' prism: ' + ${item.product.prism}"></span>
                            </td>

                            <td class="initial-quantity"
                                th:text="${item.initialQuantity}"></td>

                            <td>
                                <input type="hidden"
                                       th:field="*{items[__${stat.index}__].itemId}">

                                <input type="number"
                                       step="1"
                                       th:field="*{items[__${stat.index}__].countedQuantity}"
                                       class="counted-quantity"
                                       th:attr="data-initial-quantity=${item.initialQuantity}"
                                       style="width: 100px;">
                            </td>

                            <td class="difference">—</td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(stocktake.items)}">
                            <td colspan="9" class="empty-table-message">
                                Няма продукти в тази ревизия.
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>

                <div style="margin-top: 20px;"
                     th:if="${not #lists.isEmpty(stocktake.items)}">

                    <button type="submit" class="btn-new-order">
                        Запази ревизията
                    </button>

                    <span>
        Обща разлика: <strong id="total-difference">0</strong>
    </span>

                </div>
            </form>

        </section>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const quantityInputs = document.querySelectorAll(".counted-quantity");
        const totalDifferenceElement = document.getElementById("total-difference");

        function updateDifference(input) {

            const row = input.closest("tr");
            const differenceCell = row.querySelector(".difference");

            const value = input.value;

            if (value.trim() === "") {
                differenceCell.textContent = "—";
                return null;
            }

            const countedQuantity = Number(value);
            const initialQuantity = Number(input.dataset.initialQuantity);

            if (!Number.isInteger(countedQuantity)) {
                differenceCell.textContent = "—";
                return null;
            }

            const difference = countedQuantity - initialQuantity;

            differenceCell.textContent = difference;

            return difference;
        }

        function updateTotalDifference() {

            let totalDifference = 0;

            quantityInputs.forEach(function (input) {

                const difference = updateDifference(input);

                if (difference !== null) {
                    totalDifference += difference;
                }

            });

            totalDifferenceElement.textContent = totalDifference;
        }

        quantityInputs.forEach(function (input) {

            input.addEventListener("input", updateTotalDifference);

        });

        updateTotalDifference();

    });
</script>

</body>
</html>
