<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складови ревизии</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-wrapper">

  <div th:replace="~{header :: header-fragment}"></div>

  <div class="main-container">

    <div th:replace="~{sidebar :: sidebar-fragment}"></div>

    <section class="content">

      <div class="content-header">
        <div class="orders-title-search">
          <h1 class="page-title-blue">Складови ревизии</h1>
        </div>

        <a th:href="@{/stocktakes/new}" class="btn-new-order">
          Нова ревизия
        </a>
      </div>

      <div class="table-container orders-table">

        <table>
          <thead>
          <tr>
            <th>№</th>
            <th>Дата на създаване</th>
            <th>Създал</th>
            <th>Брой продукти</th>
            <th>Обща разлика</th>
            <th>Последен импорт</th>
            <th>Действие</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="stocktake : ${stocktakes}">

            <td th:text="${stocktake.id}"></td>

            <td th:text="${#temporals.format(stocktake.createdOn, 'dd.MM.yyyy HH:mm')}"></td>

            <td th:text="${stocktake.createdBy.username}"></td>

            <td th:text="${stocktake.items.size()}"></td>

            <td th:text="${stocktake.totalDifference != null
                ? stocktake.totalDifference
                : 0}"></td>

            <td th:text="${stocktake.importedOn != null
                            ? #temporals.format(stocktake.importedOn, 'dd.MM.yyyy HH:mm')
                            : '—'}"></td>

            <td>
              <a th:href="@{/stocktakes/{id}(id=${stocktake.id})}"
                 class="btn-new-order">
                Отвори
              </a>
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(stocktakes)}">
            <td colspan="7" class="empty-table-message">
              Все още няма създадени складови ревизии.
            </td>
          </tr>

          </tbody>
        </table>

      </div>

    </section>

  </div>
</div>

</body>
</html>
