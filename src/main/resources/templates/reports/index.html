
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">
        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content report-page">

            <div class="content-header">
                <h1 class="page-title-blue">Справки</h1>
            </div>


            <form th:action="@{/reports}" th:object="${filter}"
                  method="post" class="report-filters">

                <div class="report-filter-section report-sources">
                    <h3>Справка за</h3>

                    <div class="report-checkbox-grid">
                        <label th:each="source : ${sources}" class="report-checkbox">
                            <input type="checkbox"
                                   th:field="*{sources}"
                                   th:value="${source}">
                            <span th:text="${source.displayName}"></span>
                        </label>
                    </div>
                </div>

                <div class="report-filter-section report-main-filters">
                    <h3>Филтриране</h3>

                    <div class="report-filter-grid report-date-grid">
                        <label class="report-date-field">
                            <span>От дата</span>
                            <input type="date" th:field="*{fromDate}">
                        </label>
                        <label class="report-date-field">
                            <span>До дата</span>
                            <input type="date" th:field="*{toDate}">
                        </label>
                        <label class="report-category-field">
                            <span>Категория</span>
                            <select th:field="*{categories}" multiple size="1">
                                <option th:each="category : ${T(com.opticsappbg.opticsapp.product.model.ProductCategory).values()}"
                                        th:value="${category}"
                                        th:text="${category.displayName}"></option>
                            </select>
                        </label>
                    </div>

                    <div class="report-product-filters">
                        <label>
                            <span>Бранд</span>
                            <select id="reportBrandSelect" th:field="*{brand}">
                                <option value="">Всички брандове</option>
                            </select>
                        </label>

                        <label>
                            <span>Модел</span>
                            <select id="reportModelSelect" th:field="*{model}" disabled>
                                <option value="">Всички модели</option>
                            </select>
                        </label>

                        <label class="report-product-field">
                            <span>Конкретен продукт или стойност</span>
                            <select th:field="*{productIds}" id="reportProductSelect" multiple hidden>
                                <option th:each="product : ${products}"
                                        th:value="${product.id}"
                                        th:attr="data-category=${product.category},
                                                 data-brand=${product.brand},
                                                 data-model=${product.model}"
                                        th:text="${product.brand + ' ' + product.model
                                        + ' | SPH ' + product.sph
                                        + ' | CYL ' + product.cyl
                                        + ' | ADD ' + product.addPower
                                        + ' | PRISM ' + product.prism
                                        + (product.sizeOrDiameter != null ? ' | ' + product.sizeOrDiameter : '')
                                        + (product.barcode != null ? ' | ' + product.barcode : '')}">
                                </option>
                            </select>
                            <div class="report-product-picker" id="reportProductPicker">
                                <input type="text" id="reportProductSearch"
                                       class="report-product-search"
                                       placeholder="Въведи баркод, диоптър, диаметър или друга стойност..."
                                       autocomplete="off">
                                <div class="report-product-suggestions" id="reportProductSuggestions" hidden></div>
                                <div class="report-selected-products" id="reportSelectedProducts"></div>
                                <div id="reportProductHiddenInputs"></div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="report-filter-section">
                    <h3>Останали филтри</h3>
                    <div class="report-filter-grid report-secondary-filters">
                        <label>
                            <span>Клиент</span>
                            <select th:field="*{customerId}">
                                <option value="">Всички клиенти</option>
                                <option th:each="customer : ${customers}"
                                        th:value="${customer.id}"
                                        th:text="${customer.fullName + ' (' + customer.phone + ')'}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Доставчик</span>
                            <select th:field="*{supplierId}">
                                <option value="">Всички доставчици</option>
                                <option th:each="supplier : ${suppliers}"
                                        th:value="${supplier.id}"
                                        th:text="${supplier.companyName}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Потребител</span>
                            <select th:field="*{userId}">
                                <option value="">Всички потребители</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.username}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Метод на плащане</span>
                            <select th:field="*{paymentMethods}" multiple>
                                <option th:each="method : ${T(com.opticsappbg.opticsapp.customer.model.PaymentMethod).values()}"
                                        th:value="${method}"
                                        th:text="${method.displayName}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Групиране</span>
                            <select th:field="*{primaryGrouping}">
                                <option th:each="grouping : ${groupings}"
                                        th:value="${grouping}"
                                        th:text="${grouping.displayName}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Сортиране по</span>
                            <select th:field="*{sortBy}">
                                <option th:each="field : ${sortFields}"
                                        th:value="${field}"
                                        th:text="${field.displayName}"></option>
                            </select>
                        </label>

                        <label>
                            <span>Посока</span>
                            <select th:field="*{sortDirection}">
                                <option th:each="direction : ${sortDirections}"
                                        th:value="${direction}"
                                        th:text="${direction.displayName}"></option>
                            </select>
                        </label>
                    </div>
                </div>
                <div class="report-form-actions">
                    <button type="submit" class="btn-new-order">
                        Генерирай справка
                    </button>
                </div>

            </form>



            <div th:if="${result != null}" class="report-results">

                <div class="report-results-header">
                    <h2>Резултати</h2>
                    <span th:text="${#temporals.format(result.generatedOn, 'dd.MM.yyyy HH:mm')}"></span>
                </div>

                <div th:if="${#lists.isEmpty(result.sections)}"
                     class="empty-table-message">
                    Няма избрани източници или няма резултати.
                </div>

                <div th:each="section : ${result.sections}"
                     class="report-result-section">

                    <h3 th:text="${section.title}"></h3>

                    <div class="table-container orders-table">
                        <table>
                            <thead>
                            <tr>
                                <th>Дата</th>
                                <th>Документ</th>
                                <th>Продукт / група</th>
                                <th>Клиент</th>
                                <th>Доставчик</th>
                                <th>Потребител</th>

                                <th th:each="metric : ${section.columns}"
                                    th:text="${metric.displayName}">
                                </th>
                            </tr>
                            </thead>

                            <tbody>

                            <!-- Подробни редове без групиране -->
                            <th:block th:if="${filter.primaryGrouping == null
                                  or filter.primaryGrouping.name() == 'NONE'}">

                                <tr th:each="row : ${section.rows}">
                                    <td th:text="${row.date != null
                            ? #temporals.format(row.date, 'dd.MM.yyyy HH:mm')
                            : '—'}"></td>

                                    <td>
                                        <span th:text="${row.documentNumber != null ? row.documentNumber : '—'}"></span>
                                        <small class="report-document-type"
                                               th:if="${row.documentType != null}"
                                               th:text="${row.documentType}"></small>
                                    </td>

                                    <td th:text="${row.productName != null
                            ? row.productName : '—'}"></td>

                                    <td th:text="${row.customerName != null
                            ? row.customerName : '—'}"></td>

                                    <td th:text="${row.supplierName != null
                            ? row.supplierName : '—'}"></td>

                                    <td th:text="${row.username != null
                            ? row.username : '—'}"></td>

                                    <td th:each="metric : ${section.columns}"
                                        th:text="${row.getMetricValue(metric) != null
                                ? row.getMetricValue(metric) : '—'}">
                                    </td>
                                </tr>

                            </th:block>

                            <!-- Групирани резултати -->
                            <th:block th:unless="${filter.primaryGrouping == null
                                or filter.primaryGrouping.name() == 'NONE'}">

                                <tr th:each="group : ${section.rows}"
                                    class="report-group-row">

                                    <td colspan="6">
                                        <strong th:text="${group.groupLabel}"></strong>
                                    </td>

                                    <td th:each="metric : ${section.columns}">
                                        <strong th:text="${group.totals != null
                                    and group.totals.getMetricValue(metric) != null
                                    ? group.totals.getMetricValue(metric) : '—'}"></strong>
                                    </td>
                                </tr>

                            </th:block>

                            <!-- Общо за цялата справка -->
                            <tr th:if="${!#lists.isEmpty(section.rows)}"
                                class="report-total-row">

                                <td colspan="6">
                                    <strong>Общо</strong>
                                </td>

                                <td th:each="metric : ${section.columns}">
                                    <strong th:text="${section.totals.getMetricValue(metric) != null
                            ? section.totals.getMetricValue(metric) : '—'}"></strong>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(section.rows)}">
                                <td colspan="20" class="empty-table-message">
                                    Няма намерени записи.
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>


        </section>
    </div>
</div>

<script th:src="@{/js/report-filters.js}"></script>

</body>
</html>
